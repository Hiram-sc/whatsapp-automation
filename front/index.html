<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <section class="panel">
            <div class="header">
                <h2 class="title">Painel</h2>
            </div>

            <div class="panel-stats">
                <div class="stat-item">
                    <label class="text-primary">Mensagens enviadas: </label>
                    <label class="status" id="status">0</label>
                </div>
                
                <div class="stat-item">
                    <label class="text-primary">Tempo percorrido: </label>
                    <label class="status">00:00:00</label>
                </div>
            </div>
            
            <div class="panel-config">
                <label for="tempo" class="text-primary">
                    Intervalo entre mensagens (minuto): 
                </label>
                
                <input type="number" id="intervalo" name="intervalo" min="1" value="0">
            </div>
            
            <div class="panel-actions">
                <div class="file-container">
                    <input 
                        type="file"
                        id="planilha"
                        accept=".xlsx" 
                        hidden
                    >

                    <label for="planilha" class="btn-secondary">
                        Anexar planilha
                    </label>
                    
                    <span class="file-name"></span>
                </div>                

                <button
                    type="button"
                    id="conectar-whatsapp"
                    class="btn-secondary"
                >
                    Conectar WhatsApp
                </button>

                <button id="iniciar" class="btn-start">
                    Iniciar
                </button>
            </div>

        </section>
    </main>

    <!-- Modal de conexão do WhatsApp -->
    <div
        class="modal"
        id="modal-whatsapp"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-titulo"
        hidden
    >
        <div class="modal-content">
            <button
                type="button"
                id="fechar-modal"
                class="modal-close"
                aria-label="Fechar modal"
            >
                &times;
            </button>

            <h2 id="modal-titulo">Conectar WhatsApp</h2>

            <p id="qr-status">
                Preparando conexão...
            </p>

            <img
                id="qr-code"
                alt="QR Code para conectar o WhatsApp"
                hidden
            >

            <p class="modal-instructions" id="qr-instrucoes" hidden>
                No celular, abra o WhatsApp, acesse
                Dispositivos conectados e escaneie o QR Code.
            </p>
        </div>
    </div>

    <script src="/static/js/painel.js" defer></script>
</body>
</html>
